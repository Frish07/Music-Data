[package]
name = "music-data"
version = "1.0.0"
edition = "2021"
description = "Portable offline MP3 metadata editor for Windows"
license = "MIT"

[[bin]]
name = "MusicData"
path = "src/main.rs"

[dependencies]
id3 = "=1.17.4"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

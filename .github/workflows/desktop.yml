name: Windows portable desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust on GitHub runner only
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: windows-x64-rust-${{ hashFiles('desktop/Cargo.toml', 'desktop/Cargo.lock', 'desktop/.cargo/config.toml') }}
      - name: Resolve dependencies
        run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Check compilation
        run: cargo check --locked --target x86_64-pc-windows-msvc
      - name: Test metadata and file safety
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Optimized portable release build
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Check DLL dependencies
        run: python scripts/check_portable.py target/x86_64-pc-windows-msvc/release/MusicData.exe
      - name: Smoke test the actual executable
        run: |
          $exe = (Resolve-Path target/x86_64-pc-windows-msvc/release/MusicData.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(20000)) {
            $process.Kill()
            throw 'The portable application did not exit within 20 seconds.'
          }
          if ($process.ExitCode -ne 0) { throw "Application failed with exit code $($process.ExitCode)" }
      - name: Package portable application
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/MusicData.exe portable/MusicData.exe
          Copy-Item PORTABLE.txt portable/README.txt
          $hash = (Get-FileHash portable/MusicData.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MusicData.exe" | Set-Content portable/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path portable/* -DestinationPath MusicData-Windows-x64-portable.zip
      - name: Upload exe and portable instructions
        uses: actions/upload-artifact@v4
        with:
          name: MusicData-Windows-x64-portable
          path: desktop/portable/
          if-no-files-found: error
          retention-days: 90
      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cargo-lock
          path: desktop/Cargo.lock
          if-no-files-found: error
      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-archive
          path: desktop/MusicData-Windows-x64-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified portable files
        uses: actions/download-artifact@v4
        with:
          name: MusicData-Windows-x64-portable
          path: portable
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-archive
          path: archive
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION_TAG" > /dev/null 2>&1; then
            gh release create "$VERSION_TAG" --verify-tag --title "Music Data $VERSION_TAG" --notes 'Portable MP3 metadata editor for Windows 11 x64. Download MusicData.exe and run it. No installer, Rust, Cargo, WebView2 or additional runtime packages required. The application works offline.'
          fi
          gh release upload "$VERSION_TAG" portable/MusicData.exe portable/SHA256SUMS.txt archive/MusicData-Windows-x64-portable.zip --clobber

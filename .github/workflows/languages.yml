name: Verify repository languages

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '.gitattributes'
      - '.github/workflows/languages.yml'
  pull_request:
    paths:
      - '**/*.rs'
      - '.gitattributes'
      - '.github/workflows/languages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linguist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Analyze with the official GitHub Linguist image
        run: |
          docker run --rm -v "$PWD:$PWD:ro" -w "$PWD" \
            ghcr.io/github-linguist/linguist:latest \
            github-linguist --breakdown --json > "$RUNNER_TEMP/languages.json"
      - name: Verify Rust sources are counted
        env:
          REPORT: ${{ runner.temp }}/languages.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['REPORT']).read_text())
          rust = data.get('Rust', {})
          assert rust.get('size', 0) > 0, 'Rust is missing from Linguist statistics'
          expected = {'desktop/src/main.rs', 'desktop/src/metadata.rs', 'desktop/src/windows.rs'}
          assert expected.issubset(set(rust.get('files', []))), 'Some Rust sources were excluded'
          lines = ['## Repository language analysis', '', 'Official GitHub Linguist analysis of this commit. The GitHub sidebar is refreshed separately by GitHub.', '', '| Language | Bytes | Share |', '| --- | ---: | ---: |']
          for language, info in sorted(data.items(), key=lambda item: -item[1]['size']):
              lines.append(f"| {language} | {info['size']} | {info['percentage']}% |")
          print(json.dumps(data, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Upload complete language report
        uses: actions/upload-artifact@v4
        with:
          name: repository-language-report
          path: ${{ runner.temp }}/languages.json
          if-no-files-found: error
